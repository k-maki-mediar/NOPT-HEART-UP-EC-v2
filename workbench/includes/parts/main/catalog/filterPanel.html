<!-- SP専用フィルターパネル（PCでは非表示） -->
<div class="c-filter-panel">
  <button
    class="c-filter-panel__toggle js-filter-toggle"
    aria-expanded="false"
    aria-controls="filterPanelBody"
    type="button"
  >
    <span class="c-filter-panel__toggle-text">絞り込む</span>
    <span class="c-filter-panel__toggle-icon" aria-hidden="true"></span>
  </button>

  <div class="c-filter-panel__body" id="filterPanelBody">
    <!-- キーワード検索 -->
    <div class="c-filter-panel__search">
      <label class="c-filter-panel__search-label" for="filterKeyword">
        <input
          type="search"
          class="c-filter-panel__search-input"
          id="filterKeyword"
          name="keyword"
          placeholder="キーワードを入力"
        >
        <span class="c-filter-panel__search-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      </label>
    </div>

    <!-- カテゴリタグ群 -->
    <ul class="c-filter-panel__tag-list" aria-label="カテゴリ絞り込み">
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">コンタクトレンズ</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">ケア用品</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">メガネ</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">1day</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">2weeks</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">乱視用</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">遠近両用</a>
      </li>
      <li class="c-filter-panel__tag-item">
        <a href="#" class="c-filter-panel__tag">サークルレンズ</a>
      </li>
    </ul>

    <!-- 検索ボタン -->
    <div class="c-filter-panel__action">
      <button type="submit" class="c-filter-panel__btn">商品から探す</button>
    </div>
  </div>
</div>
