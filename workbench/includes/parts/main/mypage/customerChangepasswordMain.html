<div class="c-customer-changepassword-main">

  <h1 class="c-customer-changepassword-main__title">パスワード変更</h1>

  <!-- 必須マーク説明 -->
  <p class="c-guest-main__required-note">
    <span class="c-guest-main__required" aria-label="必須">必須</span>
    は必須入力項目です
  </p>

  <!-- パスワード形式注意文 -->
  <p class="c-customer-changepassword-main__policy-note">
    ※ パスワードは8文字以上で、半角の英字と数字を組み合わせてください。また、「-」「_」「.」も利用可能です。
  </p>

  <!-- フォーム -->
  <form action="#" method="post" novalidate>

    <dl class="c-customer-changepassword-main__form-table">

      <!-- 現パスワード -->
      <div class="c-customer-changepassword-main__field">
        <dt class="c-customer-changepassword-main__field-label">
          現パスワード<span class="c-guest-main__required" aria-label="必須">必須</span>
        </dt>
        <dd class="c-customer-changepassword-main__field-body">
          <input
            type="password"
            class="c-guest-main__input js-changepassword-field"
            name="oldPassword"
            maxlength="20"
            autocomplete="current-password"
            aria-label="現パスワード"
            aria-required="true"
            data-error-msg="現パスワードは必ず入力してください">
          <p class="c-field-error js-field-error" role="alert" hidden>現パスワードは必ず入力してください</p>
        </dd>
      </div>

      <!-- 新パスワード -->
      <div class="c-customer-changepassword-main__field">
        <dt class="c-customer-changepassword-main__field-label">
          新パスワード<span class="c-guest-main__required" aria-label="必須">必須</span>
        </dt>
        <dd class="c-customer-changepassword-main__field-body">
          <input
            type="password"
            class="c-guest-main__input js-changepassword-field"
            name="newPassword"
            maxlength="20"
            autocomplete="new-password"
            aria-label="新パスワード"
            aria-required="true"
            data-error-msg="新パスワードは必ず入力してください">
          <p class="c-field-error js-field-error" role="alert" hidden>新パスワードは必ず入力してください</p>
        </dd>
      </div>

      <!-- 新パスワード確認 -->
      <div class="c-customer-changepassword-main__field">
        <dt class="c-customer-changepassword-main__field-label">
          新パスワード確認<span class="c-guest-main__required" aria-label="必須">必須</span>
        </dt>
        <dd class="c-customer-changepassword-main__field-body">
          <input
            type="password"
            class="c-guest-main__input js-changepassword-field"
            name="newPasswordConfirm"
            maxlength="20"
            autocomplete="new-password"
            aria-label="新パスワード確認"
            aria-required="true"
            data-error-msg="新パスワード確認は必ず入力してください">
          <p class="c-field-error js-field-error" role="alert" hidden>新パスワード確認は必ず入力してください</p>
        </dd>
      </div>

    </dl>

    <!-- ボタンエリア -->
    <div class="c-customer-changepassword-main__actions">
      <a href="#" class="c-guest-main__btn c-guest-main__btn--back c-customer-changepassword-main__btn--back">
        前へ戻る
      </a>
      <button
        type="submit"
        class="c-guest-main__btn c-guest-main__btn--next c-customer-changepassword-main__btn--next">
        変更する
      </button>
    </div>

  </form>

</div>
