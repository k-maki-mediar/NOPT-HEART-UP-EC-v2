<!-- 商品説明エリア -->
<div class="c-detail-description" aria-label="商品説明">

  <!-- 1) 商品説明 -->
  <div class="c-detail-description__section">
    <h2 class="c-detail-description__section-heading">商品説明</h2>
    <div class="c-detail-description__section-body">
      <p>この商品は〇〇〇〇〇〇〇〇〇の商品です。</p>
    </div>
  </div>

  <!-- 2) 商品属性 -->
  <div class="c-detail-description__section">
    <h2 class="c-detail-description__section-heading">商品属性</h2>
    <div class="c-detail-description__section-body">
      <table class="c-detail-description__attr-table">
        <tbody>
          <tr>
            <th class="c-detail-description__attr-label">容量</th>
            <td class="c-detail-description__attr-value">〇〇ml</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 3) もっと詳しい説明はこちら -->
  <div class="c-detail-description__section">
    <h2 class="c-detail-description__section-heading">もっと詳しい説明はこちら</h2>
    <div class="c-detail-description__section-body">
      <a href="#" class="c-detail-description__ext-link">http://www.example.com</a>
    </div>
  </div>

</div>
